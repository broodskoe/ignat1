<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Позиционирование и слои z-index</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <nav>Навигация сайта</nav>
  </header>

  <main>
    <h1>Акционные товары</h1>
    <div class="card">
      <span class="badge">-30%</span>
      <h3>Товар по акции</h3>
      <p>Описание товара</p>
    </div>
  </main>

  <div class="modal-overlay">
    <div class="modal">
      <button class="modal-close">×</button>
      <h2>Заголовок окна</h2>
      <p>Текст всплывающего окна</p>
    </div>
  </div>

</body>
</html>
